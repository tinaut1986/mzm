name: Build 3DS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 3DS Port (Release)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          chmod +x tools/bin/bannertool tools/bin/makerom
          export PATH=$GITHUB_WORKSPACE/tools/bin:/opt/devkitpro/tools/bin:$PATH
          make -C platform/3ds clean
          make -C platform/3ds -j$(nproc) RENDERER=gpu BANNERTOOL=$GITHUB_WORKSPACE/tools/bin/bannertool MAKEROM=$GITHUB_WORKSPACE/tools/bin/makerom

      - name: Determine release tag
        id: vars
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git describe --tags --always)
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Release notes: QR code (scannable with Universal-Updater / phone to get
      # the CIA download URL) plus an auto-generated changelog covering every
      # commit since the previous tag. Manual (workflow_dispatch) runs on a
      # non-tagged commit produce a prerelease page instead.
      - name: Generate changelog and QR code
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="${{ steps.vars.outputs.tag }}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}HEAD"

          {
            echo "![QR code for the ${TAG} CIA](${BASE}/QR-${TAG}.png)"
            echo
            echo "## Downloads"
            echo
            echo "- [mzm-3ds.cia](${BASE}/mzm-3ds.cia)"
            echo "- [mzm-3ds.3dsx](${BASE}/mzm-3ds.3dsx)"
            echo
            echo "## Changelog"
            echo
            git log ${RANGE} --no-merges --pretty='- %s (%h)'
          } > release_notes.md

          apt-get update -qq && apt-get install -y -qq qrencode > /dev/null
          qrencode -s 10 -o "QR-${TAG}.png" "${BASE}/mzm-3ds.cia"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mzm-3ds-build
          path: |
            platform/3ds/mzm-3ds.cia
            platform/3ds/mzm-3ds.3dsx

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: ${{ steps.vars.outputs.is_tag == 'false' }}
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            platform/3ds/mzm-3ds.cia
            platform/3ds/mzm-3ds.3dsx
            QR-${{ steps.vars.outputs.tag }}.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
