name: Build 3DS Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Install build tools (makerom & bannertool)
        run: |
          mkdir -p /opt/devkitpro/tools/bin
          curl -sL https://github.com/Steveice10/bannertool/releases/download/v1.2.0/bannertool.zip -o bannertool.zip
          unzip -q -o bannertool.zip linux-x86_64/bannertool -d /tmp
          mv /tmp/linux-x86_64/bannertool /opt/devkitpro/tools/bin/bannertool
          chmod +x /opt/devkitpro/tools/bin/bannertool
          rm -f bannertool.zip
          
          curl -sL https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -o makerom.zip
          unzip -q -o makerom.zip -d /tmp
          mv /tmp/makerom-v0.18.4-ubuntu_x86_64 /opt/devkitpro/tools/bin/makerom
          chmod +x /opt/devkitpro/tools/bin/makerom
          rm -f makerom.zip

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 3DS Port (Release)
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=/opt/devkitpro/tools/bin:$PATH
          make -C platform/3ds clean
          make -C platform/3ds -j$(nproc) RENDERER=gpu BANNERTOOL=/opt/devkitpro/tools/bin/bannertool MAKEROM=/opt/devkitpro/tools/bin/makerom

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mzm-3ds-build
          path: |
            platform/3ds/mzm-3ds.cia
            platform/3ds/mzm-3ds.3dsx

      - name: Generate Release Tag Name
        id: vars
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          GIT_TAG=$(git describe --tags --always)
          echo "tag=$GIT_TAG" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: ${{ steps.vars.outputs.is_tag == 'false' }}
          files: |
            platform/3ds/mzm-3ds.cia
            platform/3ds/mzm-3ds.3dsx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
