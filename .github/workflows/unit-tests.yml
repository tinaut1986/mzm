name: Unit tests

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  port-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Run port translation layer unit tests
        run: make -C platform/linux test-unit

      - name: Run PSG synthesiser unit tests
        run: make -C platform/linux test-psg
